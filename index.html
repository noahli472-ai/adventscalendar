<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Türchen 24</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: eine schmale Karte wie ein Briefbogen, Kerzenschein von oben, die 24 Buchstabenkästchen als Herzstück */
  --cream: #F3ECE0;
  --paper: #FBF7F0;
  --sand: #D8C7AC;
  --pine: #2E4A3B;
  --ink: #2B2722;
  --muted: #6F6558;
  --glow: #E3B15E;
  --error: #9A3B2E;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100%;
  background-color: var(--cream);
  background-image: radial-gradient(ellipse 80% 45% at 50% -5%, rgba(227, 177, 94, 0.35), rgba(227, 177, 94, 0) 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  padding: 32px 16px 48px;
  display: flex;
  justify-content: center;
}
main { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 24px; }
.card {
  background: var(--paper);
  border: 1px solid var(--sand);
  border-radius: 18px;
  padding: 28px 22px;
  box-shadow: 0 10px 30px rgba(46, 74, 59, 0.08);
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.card[hidden] { display: none; }
.sprig { width: 56px; height: 56px; color: var(--pine); }
.kicker { margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pine); font-weight: 700; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 34px; line-height: 1.15; color: var(--pine); text-wrap: balance; }
h1:focus { outline: none; }
p { margin: 0; }
.lead { color: var(--muted); }
.boxes { display: flex; flex-wrap: wrap; gap: 12px 16px; }
.word { display: flex; gap: 4px; }
.box {
  width: 24px;
  height: 32px;
  border-bottom: 2px solid var(--sand);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 2px;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  color: var(--pine);
  transition: border-color 0.2s;
}
.box.filled { border-color: var(--pine); }
form { display: flex; flex-direction: column; gap: 12px; }
label { font-weight: 600; font-size: 15px; }
input[type="text"] {
  width: 100%;
  font: inherit;
  font-size: 18px;
  letter-spacing: 0.04em;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--sand);
  background: #FFFFFF;
  color: var(--ink);
}
input[type="text"]:focus-visible { outline: 3px solid rgba(227, 177, 94, 0.6); outline-offset: 2px; border-color: var(--pine); }
button {
  font: inherit;
  font-size: 17px;
  font-weight: 700;
  padding: 13px 18px;
  border-radius: 12px;
  border: none;
  background: var(--pine);
  color: var(--paper);
  cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }
button[disabled] { opacity: 0.6; cursor: progress; }
.status { min-height: 1.5em; font-size: 15px; color: var(--muted); }
.status.error { color: var(--error); }
.poster { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--sand); }
.poster[hidden] { display: none; }
.event { font-family: var(--font-display); font-size: 21px; color: var(--ink); }
.details { color: var(--muted); font-variant-numeric: tabular-nums; }
.message { white-space: pre-wrap; font-size: 18px; line-height: 1.65; border-left: 3px solid var(--glow); padding-left: 16px; }
.tickets { display: flex; flex-direction: column; gap: 14px; }
.tickets img { display: block; max-width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--sand); background: #FFFFFF; }
.placeholder { border: 2px dashed var(--sand); border-radius: 12px; padding: 18px; color: var(--muted); font-size: 15px; }
.fade-in { animation: fade 0.9s ease-out both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .fade-in { animation: none; }
  .box { transition: none; }
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <section class="card" id="lock" aria-labelledby="lock-title">
    <svg class="sprig" viewBox="0 0 64 64" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M32 60 C31 46 33 30 32 6" fill="none"/>
      <circle cx="25" cy="50" r="5.5" fill-opacity="0.18"/>
      <circle cx="39" cy="44" r="5.5" fill-opacity="0.18"/>
      <circle cx="25" cy="35" r="5" fill-opacity="0.18"/>
      <circle cx="39" cy="28" r="4.5" fill-opacity="0.18"/>
      <circle cx="26" cy="20" r="4" fill-opacity="0.18"/>
      <circle cx="37" cy="12" r="3.5" fill-opacity="0.18"/>
    </svg>
    <p class="kicker">24. Dezember</p>
    <h1 id="lock-title">Das letzte Türchen</h1>
    <p class="lead">Jetzt hast du alle 24 Buchstaben. Bring sie in die richtige Reihenfolge und gib den Satz hier ein.</p>
    <div class="boxes" id="boxes" aria-hidden="true"></div>
    <form id="form" novalidate>
      <label for="answer">Deine Lösung</label>
      <input id="answer" name="answer" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button id="submit" type="submit">Türchen öffnen</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="card" id="reveal" hidden>
    <img class="poster" id="r-poster" alt="" hidden>
    <p class="kicker" id="r-kicker"></p>
    <h1 id="r-headline" tabindex="-1"></h1>
    <p class="event" id="r-event"></p>
    <p class="details" id="r-details"></p>
    <p class="message" id="r-message"></p>
    <div class="tickets" id="r-tickets"></div>
  </section>
</main>

const WORDS = [3, 5, 5, 4, 7];
const TOTAL = WORDS.reduce((a, b) => a + b, 0);
const FORGE_URL = "https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js";

const $ = (id) => document.getElementById(id);
const input = $("answer");
const btn = $("submit");
const statusEl = $("status");

// Groß-/Kleinschreibung, Leerzeichen und Satzzeichen sind egal
function norm(s) {
  return s.normalize("NFD").toUpperCase().replace(/[^A-Z]/g, "");
}

const boxes = [];
WORDS.forEach((n) => {
  const w = document.createElement("div");
  w.className = "word";
  for (let i = 0; i < n; i++) {
    const b = document.createElement("span");
    b.className = "box";
    w.appendChild(b);
    boxes.push(b);
  }
  $("boxes").appendChild(w);
});

function paint() {
  const letters = norm(input.value);
  boxes.forEach((b, i) => {
    b.textContent = letters[i] || "";
    b.classList.toggle("filled", Boolean(letters[i]));
  });
}
input.addEventListener("input", () => { paint(); say(""); });

function say(text, isError) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", Boolean(isError));
}

function wrong() { return Object.assign(new Error("wrong"), { wrong: true }); }
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decryptSubtle(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  try {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
    return new TextDecoder().decode(pt);
  } catch (e) {
    throw wrong();
  }
}

function loadForge() {
  return new Promise((resolve, reject) => {
    if (window.forge) return resolve(window.forge);
    const s = document.createElement("script");
    s.src = FORGE_URL;
    s.onload = () => resolve(window.forge);
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function decryptForge(pass) {
  const forge = await loadForge();
  const all = atob(PAYLOAD.ct);
  const key = forge.pkcs5.pbkdf2(pass, atob(PAYLOAD.salt), PAYLOAD.iter, 32, forge.md.sha256.create());
  const d = forge.cipher.createDecipher("AES-GCM", key);
  d.start({ iv: atob(PAYLOAD.iv), tag: forge.util.createBuffer(all.slice(-16)) });
  d.update(forge.util.createBuffer(all.slice(0, -16)));
  if (!d.finish()) throw wrong();
  return forge.util.decodeUtf8(d.output.getBytes());
}

async function decrypt(pass) {
  if (window.crypto && crypto.subtle) {
    try {
      return await decryptSubtle(pass);
    } catch (e) {
      if (e.wrong) throw e;
    }
  }
  return decryptForge(pass);
}

function fill(id, text) {
  const el = $(id);
  el.textContent = text || "";
  el.hidden = !text;
}

function show(d) {
  const poster = $("r-poster");
  if (d.poster) {
    poster.src = d.poster;
    poster.alt = d.poster_alt || "";
    poster.hidden = false;
  }
  fill("r-kicker", d.kicker);
  fill("r-headline", d.headline);
  fill("r-event", d.event);
  fill("r-details", d.details);
  fill("r-message", d.message);
  const t = $("r-tickets");
  t.replaceChildren();
  if (d.images && d.images.length) {
    d.images.forEach((src, i) => {
      const img = document.createElement("img");
      img.src = src;
      img.alt = "Ticket " + (i + 1);
      t.appendChild(img);
    });
  } else if (d.tickets_placeholder) {
    const p = document.createElement("p");
    p.className = "placeholder";
    p.textContent = d.tickets_placeholder;
    t.appendChild(p);
  }
  $("lock").hidden = true;
  const r = $("reveal");
  r.hidden = false;
  r.classList.add("fade-in");
  window.scrollTo(0, 0);
  $("r-headline").focus({ preventScroll: true });
  snow();
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const letters = norm(input.value);
  if (!PAYLOAD) return say("Diese Seite ist noch nicht fertig eingerichtet.", true);
  if (!letters.length) return say("Naaa, so kannst du mich nicht austricksen, gib zuerst den Satz ein.", true);
  const diff = TOTAL - letters.length;
  if (diff === 1) return say("Da fehlt noch 1 Buchstabe.", true);
  if (diff > 1) return say("Da fehlen noch " + diff + " Buchstaben.", true);
  if (diff === -1) return say("Das ist 1 Buchstabe zu viel.", true);
  if (diff < -1) return say("Das sind " + (-diff) + " Buchstaben zu viel.", true);

  btn.disabled = true;
  say("Einen Moment …");
  try {
    show(JSON.parse(await decrypt(letters)));
  } catch (err) {
    if (err && err.wrong) {
      say("Alle 24 Buchstaben sind da, aber der Satz stimmt noch nicht. Kleiner Tipp: W B G A K.", true);
    } else {
      say("Das hat gerade nicht geklappt. Prüf deine Internetverbindung und versuch es nochmal.", true);
    }
  } finally {
    btn.disabled = false;
  }
});

function snow() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("snow");
  const ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const size = () => { c.width = innerWidth * dpr; c.height = innerHeight * dpr; };
  size();
  window.addEventListener("resize", size);
  const flakes = Array.from({ length: 70 }, () => ({
    x: Math.random(), y: -Math.random(), r: 1.5 + Math.random() * 3,
    v: 0.0012 + Math.random() * 0.002, d: Math.random() * Math.PI * 2, gold: Math.random() < 0.45
  }));
  const start = performance.now();
  function frame(t) {
    const el = t - start;
    const a = el < 7000 ? 1 : Math.max(0, 1 - (el - 7000) / 1500);
    ctx.clearRect(0, 0, c.width, c.height);
    flakes.forEach((f) => {
      f.y += f.v;
      f.d += 0.02;
      if (f.y > 1.05) { f.y = -0.05; f.x = Math.random(); }
      ctx.beginPath();
      ctx.arc((f.x + Math.sin(f.d) * 0.01) * c.width, f.y * c.height, f.r * dpr, 0, Math.PI * 2);
      ctx.fillStyle = f.gold ? "rgba(227,177,94," + (0.8 * a) + ")" : "rgba(46,74,59," + (0.22 * a) + ")";
      ctx.fill();
    });
    if (a > 0) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, c.width, c.height);
  }
  requestAnimationFrame(frame);
}
</script>
